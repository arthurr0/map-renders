map $uri $cache_control {
    default                 "public, max-age=3600";
    /                       "no-cache";
    /index.html             "no-cache";
    ~^/assets/              "public, max-age=31536000, immutable";
    ~^/(packs|hdri)/        "public, max-age=86400";
}

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/octet-stream;

    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' data: blob:; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "ok\n";
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ~ ^/(packs|hdri)/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
