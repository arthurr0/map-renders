<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Render Sandbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: repeating-conic-gradient(#d8d8d8 0% 25%, #f4f4f4 0% 50%) 50% / 24px 24px;
        font:
          13px system-ui,
          sans-serif;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        background: rgba(20, 22, 28, 0.82);
        color: #eee;
        padding: 8px 10px;
        border-radius: 6px;
        display: grid;
        grid-template-columns: auto auto;
        gap: 4px 8px;
        align-items: center;
      }
      #panel.hidden {
        display: none;
      }
      #frame {
        position: fixed;
        border: 1px dashed rgba(255, 255, 255, 0.8);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="frame"></div>
    <div id="panel"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
