name: map-renders

services:
  web:
    image: map-renders:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '127.0.0.1:8080:8080'
    restart: unless-stopped
    read_only: true
    pids_limit: 100
    mem_limit: 128m
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
